<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Spend and saving analytics">
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <!-- Three bars: budget consumed, then a shorter one, then the savings bar in
       teal — legible as a chart even at 16px. -->
  <rect x="7"  y="17" width="4.5" height="9"  rx="1.4" fill="#ffffff" opacity="0.75"/>
  <rect x="13.75" y="12" width="4.5" height="14" rx="1.4" fill="#ffffff" opacity="0.9"/>
  <rect x="20.5" y="7"  width="4.5" height="19" rx="1.4" fill="#5eead4"/>
</svg>
